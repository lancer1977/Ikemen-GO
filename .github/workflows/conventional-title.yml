# workflow-lint: pull_request_target, no checkout, no third-party actions, permissions minimal (see scripts/tests/test_workflow_pull_request_target_authority.py)
on:
  pull_request_target:
    branches: [ develop, release ]
    types: [ opened, edited, reopened, synchronize ]

permissions:
  pull-requests: write

name: conventional-title

concurrency:
  group: ikemen-conventional-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: PR title
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      # Reads PR title/number metadata only. Never checks out or executes PR source.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const titleRegex = /^(\b(build|chore|docs|feat|fix|other|perf|refactor|style|test)\b\(?[^)]*\)?: .+|v?[0-9]+\.[0-9]+\.[0-9]+|Revert .+)/;
            const title = context.payload.pull_request.title;
            const failedComment = [
              "Don't worry, if you can't fix the problem with the PR title, a person who takes care of things will handle it.",
              "",
              "We use [Conventional Commits](https://www.conventionalcommits.org/) specification for adding human and machine readable meaning to commit messages.",
              "The expected PR title formatting is: `<type>(<scope>): <description>`",
              "where `(<scope>)` declaration is optional and `<type>` must be one of the following: ",
              "- build: Changes that affect the build system, external dependencies, CI configuration",
              "- docs: Documentation only changes",
              "- feat: A new feature",
              "- fix: A bug fix",
              "- other: Changes that don't belong to other categories",
              "- perf: A code change that improves performance",
              "- refactor: A code change that neither fixes a bug nor adds a feature",
              "- style: Changes that do not affect the meaning of the code (white-space, formatting, missing semi-colons, etc)",
              "- test: Adding missing tests or correcting existing tests",
            ].join("\n");
            const succeededComment = "PR title matches our git commit title formatting guidelines. All good!";

            try {
              const matches = titleRegex.test(title);
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                event: "COMMENT",
                body: matches ? succeededComment : failedComment,
              });
              if (!matches) {
                core.setFailed(`PR title "${title}" does not match the conventional commit format.`);
              }
            } catch (error) {
              // Safe-failure path: never fail open/silently. Surface the error and fail the check.
              core.setFailed(`conventional-title check errored: ${error.message}`);
            }
