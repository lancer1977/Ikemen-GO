name: deploy-dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikemen-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev build
    runs-on: [self-hosted, linux, ikemen-linux]
    env:
      GOEXPERIMENT: arenas
      CGO_ENABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Deploy Ikemen-GO dev build
        run: ./scripts/deploy-ikemen-dev.sh

      - name: Print deployed tree
        run: ls -la ~/apps/ikemen-dev | head
